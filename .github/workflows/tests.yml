name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      # Los tests no tocan la red ni la base de datos, asi que corren en
      # segundos y no dependen de que mindicador.cl este arriba.
      - name: Correr tests
        run: pytest -q
